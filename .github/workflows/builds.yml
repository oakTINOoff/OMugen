# Builds OMugen for Windows, Linux and Android.
#
# Runs when a version tag is pushed (v1.2.3: the builds become a GitHub
# Release of this repository, with notes from docs/releases/<tag>.md), when
# the `ci` branch is pushed, or by hand
# (Actions > builds > Run workflow). Builds that are not releases are kept
# for a week as downloads on the run's page.
#
# Not on every push to main: this repository is private, so Actions minutes
# are limited (Windows minutes count double).

name: builds

on:
  push:
    tags: [ 'v*' ]
    branches: [ ci ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2022
            target: Win64
          - name: linux
            os: ubuntu-22.04
            target: Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILDTIME=$(date -u '+%Y.%m.%d')" >> "$GITHUB_ENV"

      # The same Go as local builds (go.mod's "go 1.20" is only the language level).
      - id: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      # MSYS2's package mirrors fail or stall now and then (once with six
      # builds starting together): give up after 15 minutes and try once more
      # in a fresh folder.
      - name: Set up MSYS2
        id: msys2
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 15
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-tools-git
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libxmp

      - name: Set up MSYS2 (second try)
        id: msys2_retry
        if: runner.os == 'Windows' && steps.msys2.outcome != 'success'
        timeout-minutes: 15
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: D:\msys2-retry
          update: true
          path-type: inherit
          install: >-
            git
            make
            diffutils
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-bzip2
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-tools-git
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-libxmp

      - name: Install Linux packages
        id: apt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config yasm nasm \
            libasound2-dev libgl1-mesa-dev xorg-dev libgtk-3-dev libxmp-dev libsdl2-dev

      # build.sh compiles a small FFmpeg (with libvpx, for WebM alpha) into
      # build/ffmpeg once; these files are what it checks to skip that.
      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: |
            build/ffmpeg
            build/ffmpeg-src/config_components.h
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('build/build.sh') }}

      - name: Build (Windows)
        id: build_windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash ./build/omugen_build.sh Win64

      - name: Build (Linux)
        id: build_linux
        if: runner.os == 'Linux'
        run: bash ./build/omugen_build.sh Linux

      - name: Package
        id: package
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then
            cp OMugen.exe dist/
          else
            # The libraries load before OMugen starts, so they ship next to it.
            tar -czf "dist/OMugen-$APP_VERSION-linux.tar.gz" OMugen_Linux lib
          fi
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: OMugen-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Tests
        id: tests
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          source build/omugen_env.sh
          go test -vet=off -count=1 ./src ./src/mugenjoy 2>&1 | tee build/omugen_test.log

      # The build's log and step results, readable with plain git (the run's
      # page needs a browser signed in to the repository):
      #   git fetch origin +refs/ci-logs/*:refs/ci-logs/*
      #   git show ci-logs/linux:omugen_build.log
      - name: Keep the log
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          mkdir -p "$dir"
          for f in build/omugen_build.log build/omugen_test.log; do
            if [ -f "$f" ]; then tail -n 5000 "$f" > "$dir/$(basename "$f")"; fi
          done
          printf '%s %s run %s\n%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$STEPS" > "$dir/STATUS"
          cd "$dir"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "${{ matrix.name }}: $STATUS"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/ci-logs/${{ matrix.name }}

  # The Android app (android/): the engine as libmain.so plus OMugen's own
  # app project, built with the Android SDK and NDK the runner already has.
  android:
    name: android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_BUILDTIME=$(date -u '+%Y.%m.%d')" >> "$GITHUB_ENV"
          # A newer APK must have a higher number to install over an older one.
          echo "OMUGEN_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - id: go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install packages
        id: apt
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm yasm pkg-config cmake ninja-build

      # SDL2, libxmp, libvpx and FFmpeg built for Android; build.sh skips
      # what it finds. Saved even when a later step fails.
      - name: Restore Android libraries
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            build/android-deps
            build/sdl2-src
            build/libxmp-src
            build/ffmpeg-src/config_components.h
          key: android-deps-v1-${{ hashFiles('build/build.sh') }}
          restore-keys: android-deps-v1-

      # The engine and the libraries (third-party code builds here: no
      # secrets in this step).
      - name: Build
        id: build_android
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          BUILD_ANDROID_APK=0 bash ./build/omugen_build.sh Android

      - name: Save Android libraries
        if: always() && steps.deps.outputs.cache-hit != 'true' && hashFiles('build/android-deps/lib/pkgconfig/libavcodec.pc') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/android-deps
            build/sdl2-src
            build/libxmp-src
            build/ffmpeg-src/config_components.h
          key: android-deps-v1-${{ hashFiles('build/build.sh') }}

      # The APK, signed with the release key when the repository has one
      # (secrets OMUGEN_KEYSTORE_BASE64: a PKCS12 file in base64,
      # OMUGEN_KEYSTORE_PASSWORD, optional OMUGEN_KEY_ALIAS and
      # OMUGEN_KEY_PASSWORD), else with android/omugen-test.p12. Only this
      # step (Gradle) gets the key.
      - name: APK
        id: apk
        shell: bash
        env:
          OMUGEN_KEYSTORE_BASE64: ${{ secrets.OMUGEN_KEYSTORE_BASE64 }}
          OMUGEN_KEYSTORE_PASSWORD: ${{ secrets.OMUGEN_KEYSTORE_PASSWORD }}
          OMUGEN_KEY_ALIAS: ${{ secrets.OMUGEN_KEY_ALIAS }}
          OMUGEN_KEY_PASSWORD: ${{ secrets.OMUGEN_KEY_PASSWORD }}
        run: |
          set -o pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ -n "$OMUGEN_KEYSTORE_BASE64" ]; then
            printf '%s' "$OMUGEN_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/omugen-release.p12"
            export OMUGEN_KEYSTORE="$RUNNER_TEMP/omugen-release.p12"
            echo "APK signing: the release key" | tee -a build/omugen_build.log
          else
            echo "APK signing: the test key" | tee -a build/omugen_build.log
          fi
          bash ./build/build.sh AndroidApk 2>&1 | tee -a build/omugen_build.log
          rm -f "$RUNNER_TEMP/omugen-release.p12"

      - name: Package
        id: package
        shell: bash
        run: |
          mkdir dist
          cp bin/OMugen.apk "dist/OMugen-$APP_VERSION-android.apk"
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: OMugen-android
          path: dist/*
          if-no-files-found: error
          retention-days: 7

      - name: Keep the log
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
          STEPS: ${{ toJSON(steps) }}
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          mkdir -p "$dir"
          if [ -f build/omugen_build.log ]; then tail -n 5000 build/omugen_build.log > "$dir/omugen_build.log"; fi
          printf '%s %s run %s\n%s\n' "$STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$STEPS" > "$dir/STATUS"
          cd "$dir"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "android: $STATUS"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/ci-logs/android

  release:
    name: release
    if: github.ref_type == 'tag'
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      # The release notes: docs/releases/<tag>.md.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: docs/releases

      - uses: actions/download-artifact@v8
        with:
          pattern: OMugen-*
          path: dist

      - name: Prepare files
        run: |
          mkdir release
          (cd dist/OMugen-windows && zip -9 "../../release/OMugen-$GITHUB_REF_NAME-windows.zip" OMugen.exe)
          cp dist/OMugen-linux/*.tar.gz release/
          cp dist/OMugen-android/*.apk release/
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -la release
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "OMugen $GITHUB_REF_NAME" > release-notes.md; fi

      - uses: ncipollo/release-action@v1.21.0
        with:
          name: OMugen ${{ github.ref_name }}
          bodyFile: release-notes.md
          artifacts: release/*
          artifactErrorsFailBuild: true
          allowUpdates: true
          replacesArtifacts: true

      # The result, readable with git like the builds' logs.
      - name: Keep the result
        if: always()
        continue-on-error: true
        env:
          TOKEN: ${{ github.token }}
          STATUS: ${{ job.status }}
        run: |
          dir="$RUNNER_TEMP/ci-logs"
          mkdir -p "$dir"
          { echo "$STATUS $GITHUB_REF_NAME $GITHUB_SHA run $GITHUB_RUN_ID"; ls -la release 2>&1; } > "$dir/STATUS"
          cd "$dir"
          git init -q
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "release: $STATUS"
          git push -f "https://x-access-token:$TOKEN@github.com/$GITHUB_REPOSITORY.git" HEAD:refs/ci-logs/release
